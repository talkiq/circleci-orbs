version: 2.1
description: "Tools for notifying external services about CI events"

orbs:
  slack: circleci/slack@6.1.3

executors:
  alpine-latest:
    docker:
      - image: alpine:latest
    resource_class: small

# This command has two conditions:
# - Since it could be too noisy, it MUST be used only on production deploys!
# - It MUST be used as a post-step from a job
commands:
  slack-on-fail:
    description: >
      Uses slack orb to send messages to slack when a job fails.
      Note that if a job uses parallelism or matrix, it will send as many
      messages as jobs executed.

      Requires $SLACK_ACCESS_TOKEN to be set.
    parameters:
      channel:
        default: ${SLACK_DEFAULT_CHANNEL}
        description: |
          Destination channel for your slack messages.
        type: string
    steps:
      - run:
          name: install curl
          command: |
            if which curl >/dev/null; then
              exit 0
            elif which apk >/dev/null; then
              apk add --no-cache --no-progress curl curl-dev
            elif which apt-get >/dev/null; then
              apt-get update -qy
              apt-get install -qy curl
            else
              echo >&2 "ERROR: could not find supported package manager"
              exit 1
            fi
      - slack/notify:
          channel: <<parameters.channel>>
          custom: |
            {
              "text": "",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Job Failed :x:",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "Job name: `${CIRCLE_JOB}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "Repository name: `${CIRCLE_PROJECT_REPONAME}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "Branch `${CIRCLE_BRANCH}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "Blame :point_right: @${CIRCLE_USERNAME}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Job"
                      },
                      "url": "${CIRCLE_BUILD_URL}"
                    }
                  ]
                }
              ]
            }
          event: fail

jobs:
  datadog:
    description: |
      Creates a datadog event.
    executor: <<parameters.executor>>
    parameters:
      api_key:
        default: DATADOG_API_KEY
        description: |
          Name of the environment variable containing your Datadog API key.
        type: env_var_name
      domain:
        default: "api.datadoghq.com"
        description: |
          Domain name of the Datadog ingestion API.
        type: string
      executor:
        default: alpine-latest
        description: >
          Executor for the job. Must be alpine-based. To use your own custom
          executor, see
          `https://circleci.com/docs/2.0/reusing-config/#authoring-reusable-executors`.
          Defaults to a small alpine:latest docker image.
        type: executor
      tag:
        default: ""
        description: |
          Tag of event.
        type: string
      text:
        description: |
          Body text of the event.
        type: string
      title:
        description: |
          Title (eg. key) of the event.
        type: string
    steps:
      - run: apk add --no-cache --no-progress curl
      - run: |
          curl -XPOST \
            -H "Content-Type: application/json" \
            -d '{"title": "'"<<parameters.title>>"'", "text": "'"<<parameters.text>>"'", "tags": ["'"<<parameters.tag>>"'"], "alert_type": "success"}' \
            "https://<<parameters.domain>>/api/v1/events?api_key=${<<parameters.api_key>>}"

  grafana-on-deploy:
    description: |
      Marks a deployment on Grafana dashboards with an annotation linking to the
      pull requests it ships (found as "(#123)" in commit subjects, as squash
      merges leave them), or to the commit when there are none. With a start
      time, it's drawn as a window from then until the job runs. Dashboards can
      show these with an annotation query filtered on its tags.
    executor: <<parameters.executor>>
    parameters:
      changes:
        default: ''
        description: |
          Subjects of the commits in this release, one per line, eg.
          $(git log --pretty=format:'%s' previous..${CIRCLE_SHA1}), which needs
          the repository checked out (eg. with a checkout pre-step). Evaluated by
          the shell. Pull requests are found from their "(#123)" suffixes.
        type: string
      environment:
        default: ${CIRCLE_TAG}
        description: |
          The environment being deployed.
        type: string
      executor:
        default: alpine-latest
        description: >
          Executor for the job. Must be alpine-based. To use your own custom
          executor, see
          `https://circleci.com/docs/2.0/reusing-config/#authoring-reusable-executors`.
          Defaults to a small alpine:latest docker image.
        type: executor
      grafana_url:
        description: |
          Base URL of your Grafana instance, eg. https://example.grafana.net.
        type: string
      project:
        default: ${CIRCLE_PROJECT_REPONAME}
        description: |
          The name of the project.
        type: string
      start:
        default: ''
        description: |
          When the deployment started, in seconds since the epoch. If set, the
          annotation spans from then until now, so run this once the rollout
          has finished. Evaluated by the shell.
        type: string
      tags:
        default: ''
        description: |
          Extra comma-separated tags for the annotation, which is always tagged
          "deploy", the project and the environment.
        type: string
      token:
        default: GRAFANA_TOKEN
        description: |
          Name of the environment variable containing a Grafana service account
          token allowed to create annotations.
        type: env_var_name
      version:
        default: ${CIRCLE_SHA1:0:10}
        description: |
          Newly-released version, shown when no pull request is found.
        type: string
    steps:
      - run: apk add --no-cache --no-progress curl jq
      - run: |
          if [ -z "${<<parameters.token>>}" ]; then
            echo "<<parameters.token>> is not set." >&2
            exit 1
          fi
          repo_url="https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
          payload=$(jq -n \
            --arg project "<<parameters.project>>" \
            --arg env "<<parameters.environment>>" \
            --arg tags "<<parameters.tags>>" \
            --arg version "<<parameters.version>>" \
            --arg repo_url "${repo_url}" \
            --arg sha "${CIRCLE_SHA1}" \
            --arg start "<<parameters.start>>" \
            --arg changes "<<parameters.changes>>" \
            '([$changes | split("\n")[] | capture("\\(#(?<n>[0-9]+)\\)\\s*$")? | .n] | unique_by(tonumber)) as $prs
            | (if $start == "" then {} else {time: ($start | tonumber * 1000), timeEnd: (now * 1000 | floor)} end) + {
                tags: (["deploy", $project, $env] + ($tags | split(",") | map(select(. != ""))) | unique),
                text: (
                  "<b>\($project | @html)</b> to \($env | @html): "
                  + (if ($prs | length) > 0
                     then ($prs | map("<a href=\"\($repo_url)/pull/\(.)\">#\(.)</a>") | join(", "))
                     else "<a href=\"\($repo_url)/commit/\($sha)\">\($version | @html)</a>"
                     end)
                )
              }')
          # the token goes through stdin since curl's arguments are visible to
          # other processes
          printf 'Authorization: Bearer %s' "${<<parameters.token>>}" | curl -sS --fail --max-time 10 -XPOST \
            -H @- \
            -H "Content-Type: application/json" \
            -d "${payload}" \
            "<<parameters.grafana_url>>/api/annotations"

  sentry-deployment:
    description: |
      Creates a new release deployment in Sentry. Should be run after the release has been created.
    executor: <<parameters.executor>>
    parameters:
      environment:
        default: ${CIRCLE_TAG}
        description: |
          The environment for which the release applies.
        type: string
      executor:
        default: alpine-latest
        description: >
          Executor for the job. Must be alpine-based. To use your own custom
          executor, see
          `https://circleci.com/docs/2.0/reusing-config/#authoring-reusable-executors`.
          Defaults to a small alpine:latest docker image.
        type: executor
      organization:
        default: ${CIRCLE_PROJECT_USERNAME}
        description: |
          The name of the project's organization (on Sentry).
        type: string
      token:
        default: SENTRY_TOKEN
        description: |
          Name of the environment variable containing your Sentry API token.
        type: env_var_name
      version:
        default: ${CIRCLE_SHA1:0:10}
        description: |
          Newly-released version.
        type: string
    steps:
      - run: apk add --no-cache --no-progress curl
      - run: |
          curl -XPOST \
            -H "Authorization: Bearer ${<<parameters.token>>}" \
            -H "Content-Type: application/json" \
            -d '{"environment": "'"<<parameters.environment>>"'"}' \
            "https://sentry.io/api/0/organizations/<<parameters.organization>>/releases/<<parameters.version>>/deploys/"

  sentry-release:
    description: |
      Creates a new release in Sentry.
    executor: <<parameters.executor>>
    parameters:
      commit:
        default: ${CIRCLE_SHA1}
        description: |
          The git commit SHA for the new release.
        type: string
      executor:
        default: alpine-latest
        description: >
          Executor for the job. Must be alpine-based. To use your own custom
          executor, see
          `https://circleci.com/docs/2.0/reusing-config/#authoring-reusable-executors`.
          Defaults to a small alpine:latest docker image.
        type: executor
      prev_commit:
        default: ''
        description: |
          The git commit SHA for the previous release.
        type: string
      organization:
        default: ${CIRCLE_PROJECT_USERNAME}
        description: |
          The name of the project's organization (on Sentry).
        type: string
      project:
        default: ${CIRCLE_PROJECT_REPONAME}
        description: |
          The name of the project (on Sentry).
        type: string
      repository:
        default: ${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}
        description: |
          The repository containing the referenced commits.
        type: string
      token:
        default: SENTRY_TOKEN
        description: |
          Name of the environment variable containing your Sentry API token.
        type: env_var_name
      version:
        default: ${CIRCLE_SHA1:0:10}
        description: |
          Newly-released version.
        type: string
    steps:
      - run: apk add --no-cache --no-progress curl
      - run: |
          curl -XPOST \
            -H "Authorization: Bearer ${<<parameters.token>>}" \
            -H "Content-Type: application/json" \
            -d '{
                  "version": "'"<<parameters.version>>"'",
                  "ref": "'"<<parameters.commit>>"'",
                  "refs": [{
                    "repository": "'"<<parameters.repository>>"'",
                    "commit":"'"<<parameters.commit>>"'",
                    "previousCommit":"'"<<parameters.prev_commit>>"'"
                  }],
                  "projects": ["'"<<parameters.project>>"'"]
                }' \
            "https://sentry.io/api/0/organizations/<<parameters.organization>>/releases/"

  slack-on-deploy:
    description: |
      Uses thekevjames/slack-notifier to send a deployment notification to your workspace.
    executor: <<parameters.executor>>
    parameters:
      changes:
        default: ''
        description: |
          The (optional) changelog for this release.
        type: string
      diff_url:
        default: ''
        description: |
          A link to the changeset for this release. Defaults to CircleCI's
          own compare URL for this build.
        type: string
      environment:
        default: ''
        description: |
          The environment being deployed. Defaults to the CircleCI tag
          triggering this build.
        type: string
      executor:
        default: alpine-latest
        description: >
          Executor for the job. Must be alpine-based. To use your own custom
          executor, see
          `https://circleci.com/docs/2.0/reusing-config/#authoring-reusable-executors`.
          Defaults to a small alpine:latest docker image.
        type: executor
      prev_version:
        default: unknown
        description: |
          Previously-released version.
        type: string
      project:
        default: ''
        description: |
          The name of the project. Defaults to CircleCI's own project name
          for this build.
        type: string
      user:
        default: ''
        description: |
          User responsible for this release. Defaults to `@` followed by
          the CircleCI username that triggered this build.
        type: string
      version:
        default: ''
        description: |
          Newly-released version. Defaults to the first 10 characters of
          CircleCI's own commit SHA for this build.
        type: string
      webhook:
        default: ''
        description: |
          Destination webhook URL. Defaults to the ${SLACK_DEPLOYBOT_WEBHOOK}
          environment variable.
        type: string
    steps:
      - run: apk add --no-cache --no-progress curl
      - run:
          name: Send deploy notification
          environment:
            CHANGES: <<parameters.changes>>
            DIFF_URL: <<parameters.diff_url>>
            ENVIRONMENT: <<parameters.environment>>
            NAME: <<parameters.project>>
            PREVIOUS: <<parameters.prev_version>>
            USER: <<parameters.user>>
            VERSION: <<parameters.version>>
            WEBHOOK: <<parameters.webhook>>
          command: <<include(send-deploy-notif.sh)>>
